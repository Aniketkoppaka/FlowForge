name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test, DB Integration & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge_test_password
          POSTGRES_DB: flowforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flowforge -d flowforge_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: "postgresql://flowforge:flowforge_test_password@localhost:5432/flowforge_test?schema=public"
      REDIS_URL: "redis://localhost:6379"
      NODE_ENV: "test"
      RUN_DB_INTEGRATION_TESTS: "true"
      SESSION_SECRET: "ci-test-session-secret-minimum-32-chars-flowforge"
      CSRF_SECRET: "ci-test-csrf-secret-minimum-32-chars-flowforge-123"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Generate Prisma Client & Apply All Migrations on Empty Database
        run: |
          npm run db:generate
          npm run db:migrate:deploy

      - name: Run Linter
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit, API, Engine, Worker, and Live PostgreSQL Integration Tests
        run: |
          if [ "$RUN_DB_INTEGRATION_TESTS" != "true" ]; then
            echo "ERROR: RUN_DB_INTEGRATION_TESTS must be 'true' in CI"
            exit 1
          fi
          npm run test

      - name: Run Production Build
        run: npm run build

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge_test_password
          POSTGRES_DB: flowforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U flowforge -d flowforge_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: "postgresql://flowforge:flowforge_test_password@localhost:5432/flowforge_test?schema=public"
      NODE_ENV: "test"
      SESSION_SECRET: "ci-test-session-secret-minimum-32-chars-flowforge"
      CSRF_SECRET: "ci-test-csrf-secret-minimum-32-chars-flowforge-123"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Apply Migrations
        run: |
          npm run db:generate
          npm run db:migrate:deploy

      - name: Run Linter
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Automated Tests
        run: npm run test

      - name: Run Production Build
        run: npm run build
